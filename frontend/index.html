<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a84ff">
<title>AutoPlug Tz — Your Trusted Car Parts Source</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#0a84ff; --primary-dark:#0062cc; --primary-light:#e6f2ff;
    --accent:#ff9500; --accent-light:#fff4e5;
    --bg:#f5f7fa; --card:#ffffff; --text:#0f172a; --text-light:#64748b;
    --border:#e2e8f0; --success:#22c55e; --danger:#ef4444;
    --shadow:0 2px 12px rgba(10,132,255,0.08);
    --shadow-lg:0 10px 40px rgba(10,132,255,0.15);
    --radius:16px;
  }
  html,body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; cursor:pointer; }
  input,textarea,select { font-family:inherit; }
  img { max-width:100%; display:block; }
  .app { max-width:520px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:90px; }
  .app.no-nav { padding-bottom:0; }

  /* HEADER */
  .header { background:linear-gradient(135deg, #0a84ff 0%, #0062cc 100%); color:white; padding:14px 18px; position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 20px rgba(10,132,255,0.25); }
  .header .logo { display:flex; align-items:center; gap:10px; }
  .header .logo-icon { font-size:26px; }
  .header h1 { font-size:18px; font-weight:800; letter-spacing:-0.4px; }
  .header .contact-btn { background:rgba(255,255,255,0.2); border:none; color:white; padding:8px 12px; border-radius:10px; font-size:12px; font-weight:700; display:flex; align-items:center; gap:5px; }
  .header .back-btn { background:rgba(255,255,255,0.2); border:none; color:white; width:36px; height:36px; border-radius:10px; font-size:18px; display:flex; align-items:center; justify-content:center; }

  /* BOTTOM NAV */
  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; background:white; display:flex; border-top:1px solid var(--border); box-shadow:0 -4px 20px rgba(0,0,0,0.05); z-index:100; padding-bottom:env(safe-area-inset-bottom, 0); }
  .nav-btn { flex:1; padding:10px 2px 8px; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-light); font-size:10px; font-weight:600; transition:color 0.2s; }
  .nav-btn .nav-icon { font-size:22px; transition:transform 0.2s; }
  .nav-btn.active { color:var(--primary); }
  .nav-btn.active .nav-icon { transform:translateY(-2px) scale(1.05); }

  /* HERO */
  .hero { background:linear-gradient(135deg, #0a84ff 0%, #0062cc 100%); color:white; padding:36px 22px 40px; position:relative; overflow:hidden; border-radius:0 0 28px 28px; }
  .hero::before { content:''; position:absolute; top:-60px; right:-60px; width:220px; height:220px; background:rgba(255,255,255,0.08); border-radius:50%; }
  .hero::after { content:''; position:absolute; bottom:-80px; left:-40px; width:180px; height:180px; background:rgba(255,149,0,0.15); border-radius:50%; }
  .hero .hero-content { position:relative; z-index:2; text-align:center; }
  .hero .badge-top { display:inline-block; background:rgba(255,255,255,0.2); padding:6px 14px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:0.5px; margin-bottom:16px; }
  .hero h2 { font-size:28px; font-weight:800; margin-bottom:12px; line-height:1.15; letter-spacing:-1px; }
  .hero .accent-text { color:#ffd60a; }
  .hero p { font-size:14px; opacity:0.95; line-height:1.6; max-width:380px; margin:0 auto 22px; }
  .hero .cta-row { display:flex; gap:10px; justify-content:center; }
  .hero .cta-btn { padding:13px 22px; border-radius:12px; font-size:14px; font-weight:700; border:none; transition:transform 0.1s; }
  .hero .cta-btn.primary { background:white; color:var(--primary); }
  .hero .cta-btn.secondary { background:rgba(255,255,255,0.2); color:white; border:1.5px solid rgba(255,255,255,0.4); }
  .hero .cta-btn:active { transform:scale(0.97); }
  .hero .trust-badges { display:flex; justify-content:space-around; margin-top:26px; gap:8px; position:relative; z-index:2; }
  .hero .trust { text-align:center; }
  .hero .trust .num { font-size:18px; font-weight:800; }
  .hero .trust .label { font-size:10px; opacity:0.9; margin-top:2px; }

  /* SECTIONS */
  .section-title { font-size:17px; font-weight:800; padding:24px 20px 12px; letter-spacing:-0.3px; display:flex; align-items:center; gap:8px; }

  /* ABOUT */
  .about-box { background:white; margin:16px; padding:22px; border-radius:var(--radius); box-shadow:var(--shadow); border-left:4px solid var(--accent); }
  .about-box h3 { color:var(--primary); font-size:17px; margin-bottom:12px; font-weight:800; }
  .about-box p { font-size:13px; color:var(--text-light); line-height:1.7; margin-bottom:10px; }
  .about-box p:last-child { margin-bottom:0; }
  .about-box .highlight { color:var(--accent); font-weight:700; }

  /* CATEGORY GRID */
  .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:0 16px; }
  .cat-card { background:white; padding:18px 14px; border-radius:14px; box-shadow:var(--shadow); text-align:center; cursor:pointer; transition:transform 0.15s, box-shadow 0.15s; border:1.5px solid transparent; }
  .cat-card:active { transform:scale(0.97); }
  .cat-card.selected { border-color:var(--primary); background:var(--primary-light); }
  .cat-card .ico { font-size:30px; margin-bottom:8px; }
  .cat-card h4 { font-size:13px; font-weight:700; }
  .cat-card p { font-size:11px; color:var(--text-light); margin-top:3px; }

  /* BRAND CHIPS */
  .brand-chips { display:flex; gap:8px; overflow-x:auto; padding:4px 16px 8px; scrollbar-width:none; }
  .brand-chips::-webkit-scrollbar { display:none; }
  .chip { padding:9px 16px; background:white; border:1.5px solid var(--border); border-radius:20px; font-size:13px; font-weight:700; white-space:nowrap; flex-shrink:0; color:var(--text-light); }
  .chip.active { background:var(--primary); color:white; border-color:var(--primary); }

  /* PRODUCT GRID */
  .products-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:0 16px; }
  .product-card { background:white; border-radius:14px; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; transition:transform 0.15s; }
  .product-card:active { transform:scale(0.98); }
  .product-card img { width:100%; height:130px; object-fit:cover; background:var(--bg); }
  .product-card .img-placeholder { width:100%; height:130px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:40px; color:#cbd5e1; }
  .product-card .body { padding:11px; }
  .product-card h4 { font-size:13px; font-weight:700; margin-bottom:3px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .product-card .price { color:var(--accent); font-weight:800; font-size:14px; margin-bottom:4px; }
  .product-card .brand-tag { font-size:10px; color:var(--text-light); display:flex; align-items:center; gap:3px; }

  /* PRODUCT DETAIL */
  .product-detail { background:white; }
  .product-detail .gallery { position:relative; background:#000; }
  .product-detail .gallery img { width:100%; height:320px; object-fit:contain; background:#000; }
  .product-detail .thumb-row { display:flex; gap:8px; padding:12px 16px; overflow-x:auto; scrollbar-width:none; background:white; border-bottom:1px solid var(--border); }
  .product-detail .thumb-row::-webkit-scrollbar { display:none; }
  .product-detail .thumb { width:56px; height:56px; border-radius:8px; object-fit:cover; border:2px solid transparent; cursor:pointer; flex-shrink:0; }
  .product-detail .thumb.active { border-color:var(--primary); }
  .product-detail .info { padding:20px; }
  .product-detail h2 { font-size:22px; font-weight:800; margin-bottom:6px; line-height:1.2; }
  .product-detail .price-big { color:var(--accent); font-weight:800; font-size:26px; margin-bottom:12px; }
  .product-detail .meta-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .product-detail .meta-pill { background:var(--primary-light); color:var(--primary); padding:5px 11px; border-radius:20px; font-size:11px; font-weight:700; }
  .product-detail .desc-title { font-weight:800; font-size:14px; margin:14px 0 6px; color:var(--text); }
  .product-detail .desc { font-size:13px; color:var(--text-light); line-height:1.7; }
  .product-detail video { width:100%; border-radius:12px; margin-top:14px; }

  /* ORDER BAR (sticky) */
  .order-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; background:white; padding:14px 18px; border-top:1px solid var(--border); box-shadow:0 -6px 20px rgba(0,0,0,0.08); z-index:200; padding-bottom:calc(14px + env(safe-area-inset-bottom, 0)); display:flex; gap:10px; }
  .order-bar .price-col { flex:1; }
  .order-bar .price-col .lbl { font-size:10px; color:var(--text-light); font-weight:600; }
  .order-bar .price-col .amt { font-size:20px; font-weight:800; color:var(--accent); }
  .order-bar .order-btn { background:var(--primary); color:white; border:none; padding:14px 24px; border-radius:12px; font-size:14px; font-weight:800; }

  /* FORMS */
  .form-page { padding:20px 18px; }
  .form-page h2 { font-size:20px; font-weight:800; margin-bottom:6px; }
  .form-page .sub { font-size:13px; color:var(--text-light); margin-bottom:20px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--text); }
  .field input,.field textarea,.field select { width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:11px; font-size:14px; background:white; color:var(--text); transition:border 0.15s; }
  .field input:focus,.field textarea:focus,.field select:focus { outline:none; border-color:var(--primary); }
  .field textarea { resize:vertical; min-height:70px; }
  .field small { font-size:11px; color:var(--text-light); display:block; margin-top:4px; }
  .radio-group { display:flex; gap:10px; }
  .radio-card { flex:1; padding:14px; border:2px solid var(--border); border-radius:12px; cursor:pointer; text-align:center; transition:all 0.15s; background:white; }
  .radio-card.selected { border-color:var(--primary); background:var(--primary-light); }
  .radio-card .ico { font-size:24px; margin-bottom:6px; }
  .radio-card .lbl { font-size:13px; font-weight:700; }
  .radio-card .sub { font-size:10px; color:var(--text-light); margin-top:2px; }

  .btn { width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:12px; font-size:15px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background 0.15s, transform 0.05s; }
  .btn:active { transform:scale(0.98); }
  .btn.secondary { background:white; color:var(--primary); border:2px solid var(--primary); }
  .btn.ghost { background:transparent; color:var(--text-light); border:1.5px solid var(--border); }
  .btn.success { background:var(--success); }
  .btn.danger { background:var(--danger); }
  .btn.full { width:100%; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  /* SUCCESS SCREEN */
  .success-screen { text-align:center; padding:50px 24px; }
  .success-screen .check { width:90px; height:90px; border-radius:50%; background:var(--success); color:white; display:flex; align-items:center; justify-content:center; font-size:48px; margin:0 auto 20px; animation:pop 0.5s ease; }
  @keyframes pop { 0%{ transform:scale(0) } 80%{ transform:scale(1.1) } 100%{ transform:scale(1) } }
  .success-screen h2 { font-size:24px; font-weight:800; margin-bottom:10px; }
  .success-screen p { color:var(--text-light); font-size:14px; line-height:1.6; margin-bottom:20px; }
  .success-screen .order-id { background:var(--primary-light); color:var(--primary); padding:12px 20px; border-radius:12px; font-family:monospace; font-size:14px; font-weight:700; display:inline-block; margin-bottom:20px; }
  .success-screen .contact-info { background:white; padding:18px; border-radius:12px; text-align:left; box-shadow:var(--shadow); margin-bottom:20px; }
  .success-screen .contact-info h4 { font-size:13px; margin-bottom:10px; color:var(--text); }
  .success-screen .contact-info a { display:flex; align-items:center; gap:10px; padding:8px 0; color:var(--text); text-decoration:none; font-size:14px; border-bottom:1px solid var(--border); }
  .success-screen .contact-info a:last-child { border:none; }
  .success-screen .contact-info .ic { font-size:18px; }

  /* EMPTY */
  .empty { text-align:center; padding:50px 24px; color:var(--text-light); }
  .empty .ico { font-size:56px; opacity:0.3; margin-bottom:12px; }
  .empty p { font-size:14px; }

  /* CONTACT MODAL */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-end; justify-content:center; z-index:500; }
  .modal-bg.open { display:flex; }
  .modal { background:white; width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom, 0)); max-height:88vh; overflow-y:auto; animation:slideUp 0.25s ease; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal-head h3 { font-size:17px; font-weight:800; }
  .modal-close { background:var(--bg); border:none; color:var(--text-light); width:34px; height:34px; border-radius:50%; font-size:20px; display:flex; align-items:center; justify-content:center; }

  .contact-list a { display:flex; align-items:center; gap:14px; padding:14px; background:var(--bg); border-radius:12px; margin-bottom:10px; text-decoration:none; color:var(--text); }
  .contact-list a:last-child { margin-bottom:0; }
  .contact-list .ic { font-size:22px; }
  .contact-list .lbl { font-size:11px; color:var(--text-light); font-weight:600; }
  .contact-list .val { font-size:14px; font-weight:700; }

  /* TOAST */
  .toast { position:fixed; bottom:100px; left:50%; transform:translate(-50%, 100px); background:#0f172a; color:white; padding:13px 22px; border-radius:12px; font-size:14px; font-weight:600; z-index:9999; opacity:0; transition:all 0.3s; pointer-events:none; max-width:90vw; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2); }
  .toast.show { transform:translate(-50%, 0); opacity:1; }
  .toast.success { background:var(--success); }
  .toast.danger { background:var(--danger); }

  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .muted { color:var(--text-light); }
  .text-sm { font-size:12px; }
  .mt-1 { margin-top:8px; }
  .mt-2 { margin-top:16px; }
  .mb-2 { margin-bottom:16px; }
  .divider { height:1px; background:var(--border); margin:16px 0; }
  .hidden { display:none !important; }

  @media (max-width:380px) {
    .hero h2 { font-size:24px; }
    .products-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   AutoPlug Tz — Customer App
   ============================================================ */

const API_BASE = '/api';

const API = {
  async req(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || 'Request failed');
    }
    return res.json();
  },
  get:  (p)    => API.req(p),
  post: (p, b) => API.req(p, { method:'POST', body: JSON.stringify(b) })
};

const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

const state = {
  view: 'loading',
  tab: 'home',
  products: [],
  categories: [],
  brands: [],
  selectedProduct: null,
  selectedImageIdx: 0,
  deliveryType: 'pickup',
  lastOrder: null
};

function go(view, patch = {}) {
  state.view = view;
  Object.assign(state, patch);
  window.scrollTo(0, 0);
  render();
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  try {
    const [products, categories, brands] = await Promise.all([
      API.get('/products'),
      API.get('/products/meta/categories').catch(() => []),
      API.get('/products/meta/brands').catch(() => [])
    ]);
    state.products = products;
    state.categories = categories;
    state.brands = brands;
    state.view = 'home';
  } catch (e) {
    state.view = 'home';
    console.error(e);
  }
  render();
})();

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const root = $('#root');
  switch (state.view) {
    case 'loading':   root.innerHTML = `<div class="app no-nav" style="display:flex;align-items:center;justify-content:center;padding-top:80px;font-size:64px;">⚙️</div>`; break;
    case 'home':      root.innerHTML = renderHome(); break;
    case 'category':  root.innerHTML = renderCategory(state.selectedCategory); break;
    case 'brand':     root.innerHTML = renderBrand(state.selectedBrand); break;
    case 'product':   root.innerHTML = renderProductDetail(); break;
    case 'order':     root.innerHTML = renderOrderForm(); break;
    case 'success':   root.innerHTML = renderSuccess(); break;
    default:          root.innerHTML = renderHome();
  }
}

/* ============================================================
   HOME
   ============================================================ */
function renderHome() {
  return `
  <div class="app">
    <div class="header">
      <div class="logo"><span class="logo-icon">⚙️</span><h1>AutoPlug Tz</h1></div>
      <button class="contact-btn" onclick="openContactModal()">📞 Contact</button>
    </div>

    <div class="hero">
      <div class="hero-content">
        <div class="badge-top">⭐ DAR ES SALAAM'S TRUSTED CAR PARTS</div>
        <h2>Quality <span class="accent-text">Car Spare Parts</span> Delivered Fast</h2>
        <p>Genuine spark plugs, glow plugs, ignition coils and more for every car brand. Order now — pick up or get it delivered to your door.</p>
        <div class="cta-row">
          <button class="cta-btn primary" onclick="scrollToProducts()">🛒 Shop Now</button>
          <button class="cta-btn secondary" onclick="openContactModal()">📞 Call Us</button>
        </div>
      </div>
      <div class="trust-badges">
        <div class="trust"><div class="num">100%</div><div class="label">Genuine Parts</div></div>
        <div class="trust"><div class="num">Fast</div><div class="label">Delivery</div></div>
        <div class="trust"><div class="num">24/7</div><div class="label">Support</div></div>
      </div>
    </div>

    <div class="about-box">
      <h3>🔧 Why AutoPlug Tz?</h3>
      <p>We supply <span class="highlight">high-quality car spare parts</span> from trusted brands — spark plugs, glow plugs, ignition coils and more. Every part is tested and guaranteed to fit your vehicle.</p>
      <p>Based in <span class="highlight">Dar es Salaam</span>, we serve mechanics, drivers, and fleet owners across Tanzania with fast pickup and reliable delivery.</p>
      <p><b>Cash on delivery</b> — pay when you receive. Simple, safe, and fast.</p>
    </div>

    <div class="section-title">🏷️ Shop by Category</div>
    <div class="cat-grid">
      ${(state.categories.length ? state.categories : ['Spark Plugs','Glow Plugs','Ignition Coils','Other Parts']).map(c => `
        <div class="cat-card" onclick="openCategory('${esc(c)}')">
          <div class="ico">${getCategoryIcon(c)}</div>
          <h4>${esc(c)}</h4>
          <p>${countByCategory(c)} parts</p>
        </div>
      `).join('')}
    </div>

    <div class="section-title">🚗 Shop by Car Brand</div>
    <div class="brand-chips">
      ${(state.brands.length ? state.brands : ['Toyota','Nissan','Honda','Ford']).map(b => `
        <div class="chip" onclick="openBrand('${esc(b)}')">${esc(b)}</div>
      `).join('')}
    </div>

    <div class="section-title" id="products-section">⭐ All Products (${state.products.length})</div>
    ${state.products.length ? renderProductGrid(state.products) : `
      <div class="empty">
        <div class="ico">📦</div>
        <p>No products yet.<br>Check back soon!</p>
      </div>
    `}
  </div>`;
}

function scrollToProducts() {
  const el = document.getElementById('products-section');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function getCategoryIcon(cat) {
  const c = (cat || '').toLowerCase();
  if (c.includes('spark')) return '⚡';
  if (c.includes('glow')) return '🔥';
  if (c.includes('coil')) return '🧲';
  if (c.includes('wire')) return '🔌';
  if (c.includes('filter')) return '🌬️';
  if (c.includes('brake')) return '🛑';
  if (c.includes('battery')) return '🔋';
  return '🔧';
}

function countByCategory(cat) {
  return state.products.filter(p => p.category === cat).length;
}

/* ============================================================
   PRODUCT GRID (shared)
   ============================================================ */
function renderProductGrid(products) {
  return `
    <div class="products-grid">
      ${products.map(p => `
        <div class="product-card" onclick="openProduct('${p._id}')">
          ${p.images?.[0]
            ? `<img src="${p.images[0]}" alt="${esc(p.name)}">`
            : `<div class="img-placeholder">⚙️</div>`}
          <div class="body">
            <h4>${esc(p.name)}</h4>
            <div class="price">TZS ${p.price.toLocaleString()}</div>
            <div class="brand-tag">🚗 ${esc(p.carBrand)}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function setDeliveryType(type) {

/* Live fee calculation */
document.addEventListener('input', (e) => {
  if (state.view !== 'order') return;
  const p = state.selectedProduct;
  if (!p) return;

  const qty = parseInt(document.querySelector('[name="quantity"]')?.value) || 1;
  const subtotal = p.price * qty;

  let fee = 0;
  if (state.deliveryType === 'delivery') {
    const dist = parseFloat(document.querySelector('[name="deliveryDistance"]')?.value) || 0;
    fee = 2000 + Math.round(dist * 500);
  }

  const subtotalEl = document.getElementById('subtotalDisplay');
  const feeEl = document.getElementById('deliveryFeeDisplay');
  const totalEl = document.getElementById('totalDisplay');

  if (subtotalEl) subtotalEl.textContent = `TZS ${subtotal.toLocaleString()}`;
  if (feeEl) feeEl.textContent = `TZS ${fee.toLocaleString()}`;
  if (totalEl) totalEl.textContent = `TZS ${(subtotal + fee).toLocaleString()}`;
});

/* ============================================================
   SUBMIT ORDER
   ============================================================ */
async function submitOrder(e) {
  e.preventDefault();
  const btn = $('#submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Placing order...';

  const p = state.selectedProduct;
  const fd = new FormData(e.target);

  try {
    const res = await API.post('/orders', {
      customerName: fd.get('customerName').trim(),
      customerEmail: fd.get('customerEmail').trim(),
      customerPhone: fd.get('customerPhone').trim(),
      productId: p._id,
      quantity: parseInt(fd.get('quantity')) || 1,
      deliveryMethod: state.deliveryType,
      deliveryAddress: fd.get('deliveryAddress')?.trim() || '',
      deliveryDistance: parseFloat(fd.get('deliveryDistance')) || 0,
      notes: fd.get('notes')?.trim() || ''
    });

    state.lastOrder = res.order;
    go('success');
  } catch (err) {
    toast('Failed: ' + err.message, 'danger');
    btn.disabled = false; btn.textContent = '✅ Place Order';
  }
}

function showModal(title, html) {
  let bg = document.getElementById('appModal');
  if (!bg) {
    bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.id = 'appModal';
    bg.onclick = (e) => { if (e.target === bg) closeModal(); };
    bg.innerHTML = `<div class="modal"><div class="modal-head"><h3 id="appModalTitle"></h3><button class="modal-close" onclick="closeModal()">×</button></div><div id="appModalBody"></div></div>`;
    document.body.appendChild(bg);
  }
  document.getElementById('appModalTitle').textContent = title;
  document.getElementById('appModalBody').innerHTML = html;
  bg.classList.add('open');
}

function closeModal() {
  const bg = document.getElementById('appModal');
  if (bg) bg.classList.remove('open');
}
